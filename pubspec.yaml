name: tally_mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

flutter_intl:
  main_locale: en
  enabled: true

dependencies:
  either_dart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.8
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.3
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

dev_dependencies:
  build_runner: ^2.16.0
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter_18pt-Medium.ttf
        weight: 400
      - asset: assets/fonts/Inter_18pt-Regular.ttf
        weight: 500

flutter:
  uses-material-design: true
  generate: true
